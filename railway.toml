# Prefer per-service configs (railway.web.toml / railway.worker.toml).
# Kept so `railway up` without an explicit config still builds the web image.
[build]
dockerfilePath = "Dockerfile.web"

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
